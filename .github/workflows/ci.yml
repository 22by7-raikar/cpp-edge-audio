name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j "$(nproc)"
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scikit-learn soundfile pytest
      - run: python -m pytest -q tests/python
      - name: Parity corpus is reproducible from the committed artifact
        run: |
          python tools/python/export/export_quality_model.py --corpus-only --corpus /tmp/parity.bin
          cmp /tmp/parity.bin tests/data/quality_model_v1_parity.bin

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          find src apps tests -name '*.h' -o -name '*.cpp' | grep -v quality_model_data.h \
            | xargs clang-format --dry-run --Werror

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Doxygen (warnings are errors)
        run: doxygen docs/Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/html
